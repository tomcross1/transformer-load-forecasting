seed: 42
data:
  processed_path: data/processed/household_power_hourly.csv
  lookback: 168
  horizon: 24
  train_ratio: 0.70
  val_ratio: 0.15
  target: global_active_power
  features:
    - global_active_power
    - global_reactive_power
    - voltage
    - global_intensity
    - sub_metering_1
    - sub_metering_2
    - sub_metering_3
    - hour_sin
    - hour_cos
    - dow_sin
    - dow_cos
    - month_sin
    - month_cos
model:
  d_model: 64
  nhead: 4
  num_layers: 3
  dim_feedforward: 128
  dropout: 0.10
training:
  batch_size: 64
  epochs: 30
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 6
  num_workers: 0
xgboost:
  n_estimators: 250
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.9
  colsample_bytree: 0.9

